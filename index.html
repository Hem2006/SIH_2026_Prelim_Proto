<!doctype html>
<html lang="en" class="h-full bg-[#F7F6F3]">
  <head>
    <meta charset="UTF-8" />
    <!-- App icon — Maharashtra state emblem on navy, matching the in-app masthead. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A2836" />

    <!-- Home-screen install behaves as a standalone app, not a browser tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aarambh" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Aarambh - Startup-Friendly Public Procurement Platform</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL SCRIPT ERROR:', e);
        var errBox = document.getElementById('debug-error-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'debug-error-box';
          errBox.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff1f2;color:#9f1239;padding:24px;font-family:monospace;font-size:13px;z-index:999999;white-space:pre-wrap;overflow:auto;';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = '<h2 style="font-size:18px;font-weight:bold;margin-bottom:8px;">Runtime / Script Error:</h2>' +
          '<strong>' + (e.message || 'Unknown Error') + '</strong>\n' +
          '<span>File: ' + (e.filename || '') + ':' + (e.lineno || '') + '</span>\n\n' +
          (e.error && e.error.stack ? e.error.stack : '');
      });
    </script>
  </head>
  <body class="h-full bg-[#F7F6F3] text-slate-600 antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
