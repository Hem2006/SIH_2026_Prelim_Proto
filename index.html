<!doctype html>
<html lang="en" class="h-full bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231F4E5C'%3E%3Cpath d='M12 2L2 22h20L12 2zm0 3.99L18.47 18H5.53L12 5.99z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precedent - Startup-Friendly Public Procurement Platform</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL SCRIPT ERROR:', e);
        var errBox = document.getElementById('debug-error-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'debug-error-box';
          errBox.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff1f2;color:#9f1239;padding:24px;font-family:monospace;font-size:13px;z-index:999999;white-space:pre-wrap;overflow:auto;';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = '<h2 style="font-size:18px;font-weight:bold;margin-bottom:8px;">Runtime / Script Error:</h2>' +
          '<strong>' + (e.message || 'Unknown Error') + '</strong>\n' +
          '<span>File: ' + (e.filename || '') + ':' + (e.lineno || '') + '</span>\n\n' +
          (e.error && e.error.stack ? e.error.stack : '');
      });
    </script>
  </head>
  <body class="h-full text-slate-900 antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
